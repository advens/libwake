name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and test
        run: make test

      - name: source tarball
        run: |
          v="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="libwake-${v}/" -o "libwake-${v}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "libwake-${v}.tar.gz" > "libwake-${v}.tar.gz.sha256"

      - name: changelog section
        run: |
          v="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$v" '
              $0 ~ "^## \\[" v "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md." > RELEASE_NOTES.md

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            libwake-*.tar.gz
            libwake-*.tar.gz.sha256
