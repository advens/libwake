name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and test
        run: make test

      - name: source tarball
        run: |
          v="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="libwake-${v}/" -o "libwake-${v}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "libwake-${v}.tar.gz" > "libwake-${v}.tar.gz.sha256"

      - name: notes
        run: |
          v="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$v" '
              $0 ~ "^## \\[" v "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'libwake %s\n' "$v" > RELEASE_NOTES.md
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME}"
          gh release create "$v" \
            "libwake-${v}.tar.gz" \
            "libwake-${v}.tar.gz.sha256" \
            --title "$v" \
            --notes-file RELEASE_NOTES.md
